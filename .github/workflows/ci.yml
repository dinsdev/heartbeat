name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # R45: `uv run` never re-locks in CI; everything installs from uv.lock.
  UV_FROZEN: "1"

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: committed results must name a commit that is an
          # ancestor of HEAD (tests/unit/test_results_committed.py).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      # The 132 pinned MIT-BIH files for the real-data tests (L2). The key is the
      # checksum manifest, and the download step checks every cached file (R2).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw/mitdb/1.0.0
          key: mitdb-1.0.0-${{ hashFiles('manifests/mitdb-1.0.0.sha256') }}
      - run: uv run heartbeat download
      # Runs the wording lint, the rule-coverage check, the R45 and R46 checks,
      # and the real-data tests.
      - run: uv run pytest
      # OPS-04: manifests, cache, folds, model files, NOTICE, fixture parity,
      # card blocks and the sealed-run log, without training.
      - run: uv run heartbeat verify

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Phase 6 design call 18: the DS1 demo data (DEMO-17) for the build, the
      # size gates and Playwright. Built here from the cached MIT-BIH files and
      # the committed model, with the actions the python job already pins,
      # rather than handed over as an artifact (no new action in Goal A).
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw/mitdb/1.0.0
          key: mitdb-1.0.0-${{ hashFiles('manifests/mitdb-1.0.0.sha256') }}
      - run: uv run heartbeat download
      - run: uv run heartbeat prepare
      - run: uv run heartbeat build-demo-data
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web run lint
      # Web files and every Markdown file in the repo.
      - run: pnpm -C web run format:check
      - run: pnpm -C web run check
      - run: pnpm -C web run test
      # vite build, then the size gates on dist/ (R39).
      - run: pnpm -C web run build
      # PUB-05: the wording lint on the built demo text.
      - run: uv run python -m heartbeat.checks.wording web/dist/index.html web/dist/data/*.txt web/dist/assets/*.js
      - run: pnpm -C web exec playwright install --with-deps chromium webkit
      - run: pnpm -C web run e2e
