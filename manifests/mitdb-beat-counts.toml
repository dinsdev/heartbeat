# Expected beat counts per record and annotation symbol (DATA-11, R11's oracle).
# Copied on 2026-10-29 from PhysioNet's MIT-BIH Arrhythmia Database Directory,
# "Table of beat types (entire records)":
# https://archive.physionet.org/physiobank/database/html/mitdbdir/tables.htm
#
# Keys are the symbols in the .atr files. Three of the table's column headings
# differ from them: "." is N, "P" (paced) is /, and "p" (non-conducted P wave)
# is x, per the symbol list in the same directory (intro.htm). Symbols with a
# zero count are left out. "!" (flutter wave) and x are counted here but are not
# beats (B4). Only the 44 downloaded records are listed; the four paced records
# are never downloaded.
#
# Checked when copied: the DS1 and DS2 totals by AAMI class equal PRD Appendix C.
# Changing this file is a rigor event: Din's go and a ledger entry (rule 4).

